# cfgx example configuration
# Generated by cfgx. Update with your values.

# ── General ───────────────────────────────────────────────────────────
# Human-readable application name
app-name: webapp

# Enable debug logging; hot-reloadable via APP_DEBUG
debug: false

# Print machine-readable JSON output
json-output: false

# File to write logs to
# DEPRECATED: logs go to stderr; redirect them instead
log-file: ""

# Output format
output-format: text

# Print human-readable text output
text-output: false

# ── Server ────────────────────────────────────────────────────────────
# HTTP port the server listens on
port: 8080

# Path to the TLS certificate (required when tls-enabled=true) (required)
tls-cert-path: ""

# Enable TLS
tls-enabled: false

# ── Database ──────────────────────────────────────────────────────────
# Database connection settings
db:
  # Connection string derived from the other db settings
  # dsn is computed; do not set manually
  # Database host
  host: localhost
  # Database name (required)
  name: ""
  # Database password (required)
  # sensitive — do not commit this value
  password: ""
  # Database port
  port: 5432
  # Database user
  user: postgres

# ── Email ─────────────────────────────────────────────────────────────
# Send notification emails
email-enabled: false

# Outgoing mail settings
smtp:
  # SMTP server host
  host: localhost
  # SMTP password (required)
  # sensitive — do not commit this value
  password: ""
  # SMTP server port
  port: 587
  # SMTP user (required)
  user: ""
