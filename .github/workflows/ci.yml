name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: golangci-lint
        # v6 of the action runs golangci-lint v1, which reads the repo's v1
        # .golangci.yml. Keep the version pinned; v2 rejects the v1 config.
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.21", "1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (with race detector)
        run: go test -race -count=1 -timeout=300s ./...
      - name: Test coverage
        if: matrix.go == '1.21'
        run: go test -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: matrix.go == '1.21'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
      # The e2e suite builds its own cfgx binary from ./cmd/cfgx.
      - name: Run e2e tests
        run: go test -tags e2e -race -count=1 -timeout=600s ./_test/e2e/...

  golden-files:
    name: Check golden files are up to date
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
      - name: Run golden file update
        run: go test ./gen/... -update
      - name: Check for diffs
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Golden files are out of date. Run 'go test ./gen/... -update' and commit."
            git status --porcelain
            git diff
            exit 1
          fi

  example:
    name: Build example project
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: examples/webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: |
            go.sum
            examples/webapp/go.sum
      # //go:generate runs `go run github.com/epistemer/cfgx/cmd/cfgx gen`,
      # resolved to this checkout through the example's replace directive.
      - name: Regenerate example
        run: go generate ./cmd/...
      - name: Check generated files are up to date
        # docs/config.1 carries a date line, so it is allowed to differ.
        run: |
          if ! git diff --exit-code -- . ':!docs/config.1'; then
            echo "examples/webapp is out of date. Run 'go generate ./cmd/...' in examples/webapp and commit."
            exit 1
          fi
      - name: Build example
        run: go build ./...
      - name: Check no cfgx/viper in pkg/
        run: |
          if grep -r "github.com/epistemer/cfgx\|github.com/spf13/viper" pkg/; then
            echo "ERROR: business logic packages must not import cfgx or viper"
            exit 1
          fi
